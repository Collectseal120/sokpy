[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sokpy"
version = "0.1.6"
description = "Unofficial Python wrapper for SOK / S-Kaupat APIs"
readme = "README.md"
authors = [
  {name = "Collectseal120"}
]
license = "MIT"
requires-python = ">=3.7"
dependencies = [
  "requests",
  "beautifulsoup4"
]

[project.urls]
Homepage = "https://github.com/Collectseal120/sokpy"
Repository = "https://github.com/Collectseal120/sokpy"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "integration: live SOK API tests",
  "regression: regression tests for known stable product and store IDs",
]
